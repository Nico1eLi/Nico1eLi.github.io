  about:
    enable: true
    title: "About Me"
    image: "/images/about.jpg"
    content: |-
      Hello!
      
      I am a Ph.D. Candidate in the Department of Government and Public Administration at the University of Macau, currently on the 2026-2027 academic job market.  
      
      My research bridges comparative politics and public policy communication, with a specialized focus on cultural governance, entertainment politics, and the dynamics of celebrity politics under non-democratic regimes. Utilizing quantitative data analysis and experimental survey designs, I explore how these elements shape public perception and policy outcomes.  
      
      I am actively seeking academic and research roles. Please feel free to reach out to discuss my work, potential collaborations, or upcoming career opportunities.

