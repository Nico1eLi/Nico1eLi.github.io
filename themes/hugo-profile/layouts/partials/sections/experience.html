{{ if .Site.Params.experience.enable | default false }}
<section id="experience" class="py-5">
    <div class="container">
        <h3 class="text-center">{{ .Site.Params.experience.title | default "Research" }}</h3>
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-10 col-lg-10 py-5">
                <div class="experience-container px-3 pt-4 pb-3">
                    {{ range .Site.Params.experience.items }}
                    <div class="research-group mb-4">
                        <div class="research-group-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <span class="h4">{{ .job }}</span>
                            <small>{{ .date }}</small>
                        </div>

                        <div class="research-timeline">
                            {{ range .timeline }}
                            <div class="timeline-item">
                                <div class="timeline-marker"></div>
                                <div class="timeline-content">
                                    <div class="timeline-meta">
                                        <small>{{ .date }}</small>
                                    </div>
                                    {{ .content | markdownify }}
                                </div>
                            </div>
                            {{ end }}
                        </div>
                    </div>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
