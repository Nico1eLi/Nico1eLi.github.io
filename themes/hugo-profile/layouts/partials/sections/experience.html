{{ if .Site.Params.experience.enable | default false }}
<section id="experience" class="py-5">
    <div class="container">
        <h3 class="text-center">{{ .Site.Params.experience.title | default "Experience" }}</h3>
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-10 col-lg-10 py-5">
                <div class="experience-container px-3 pt-4 pb-3">
                    <div class="timeline">
                        {{ range .Site.Params.experience.items }}
                        <div class="timeline-item">
                            <div class="timeline-marker"></div>
                            <div class="timeline-content">
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <span class="h4">{{ .job }}</span>
                                    <small>{{ .date }}</small>
                                </div>

                                <div class="pb-2">
                                    <small>{{ .company }}</small>
                                </div>

                                {{ .content | markdownify }}
                            </div>
                        </div>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
